<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Edge — Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="./lab.css" rel="stylesheet">
</head>

<!-- m4.4L — THE LAB: a design sandbox on live engine data
     (PLAYER_BREAKDOWN_SPEC amendment). It reads ONE file,
     ../data/lab.json, written by fantasy_edge.live.lab, and computes
     nothing. It is NOT the board: it carries no live layer, contacts
     no feed, and nothing here has graduated to the product. -->
<body data-lab="../data/lab.json"
      data-demo-lab="../demo/lab.demo.json"
      data-density="comfortable">

<!-- THE IN-PROGRESS BANNER, written into the page itself and not only
     by the script, so it is on screen before anything is fetched and
     stays there if the fetch never answers. `lab.js` re-renders this
     same element from its own LAB_IN_PROGRESS constant, and a test
     asserts the two strings are the same one. -->
<div class="banner lab" id="labbanner">LAB — IN PROGRESS: design sandbox on live data; numbers are real, presentation is experimental</div>

<div id="topbanner"></div>

<div class="wrap">

<header>
  <div class="toprow">
    <h1>Fantasy Edge <span class="alpha">LAB</span></h1>
    <div class="runpill" id="runpill">loading</div>
  </div>
  <div class="gameline" id="gameline"></div>
</header>

<div class="disc" id="disclosure"></div>

<!-- the variant switcher scaffold: one control, two densities, so a
     design question can be looked at side by side in the same session
     rather than rebuilt for each answer -->
<div class="controls">
  <div class="seg" id="density" role="group"
       aria-label="Layout density"></div>
</div>

<div id="roster"></div>
<div id="detail"></div>
<div class="empty" id="empty" hidden></div>

<div class="foot" id="foot"></div>

</div>

<script src="./lab.js"></script>
</body>
</html>
