<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Edge — Sweat sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="./sweat.css" rel="stylesheet">
</head>

<!-- LAB ITERATION L3 — THE SWEAT SANDBOX (SWEAT_LAB_SPEC, realising
     docs/design/SWEAT_UI_BRIEF.md frames 1-9). Two screens — the live
     sweats board and the chart-first sweat card — as one page with
     client-side navigation.

     IT READS ONE FILE, AND WHICH ONE IS THE MODE (L3b, D-122):

       REAL, THE DEFAULT: ../../data/sweats.json, written by
       fantasy_edge.live.sweat — the engine's own pregame probabilities
       against the market lines the live capture stored, with the
       prices as captured. Owner-ruled onto this lab surface under its
       ALPHA banner; it is an uncalibrated model and it is not a pick.

       DEMO, ONLY WITH ?demo=1: ../../demo/sweats.demo.json, an array
       of poll snapshots, every one of them fabricated, kept as the
       design and QA harness.

     The two never mix: sweat.js picks one URL before it fetches. -->
<body data-sweats-real="../../data/sweats.json"
      data-sweats-demo="../../demo/sweats.demo.json">

<!-- THE TWO BANNERS, written into the page itself and not only by the
     script, so they are on screen before anything is fetched and stay
     there if the fetch never answers. `sweat.js` re-renders these same
     elements from its own constants, and a test asserts the page and
     the constants say the same thing.

     The top slot carries the MODE'S OWN sentinel. The page ships with
     the ALPHA one on it because real is the default; `?demo=1` swaps
     in the SAMPLE one, which rides here too (`data-sample`) so both
     strings live on disk beside the script's own and neither can drift
     from it. One of them is on screen at all times, never both. -->
<div class="banner sample" id="topbanner"
     data-sample="SAMPLE SWEATS — fabricated bets and numbers for design work; nothing here is a pick, a price, or a recommendation">ALPHA SWEATS — real lines and engine probabilities; model, not yet calibrated; experimental presentation (D-122)</div>
<div class="banner lab" id="labbanner">LAB — IN PROGRESS: design sandbox; presentation is experimental</div>

<!-- Frame 9's paused banner. Hidden until the replay has stood still
     for longer than twice the recording's own poll interval. -->
<div class="stale" id="stale" hidden></div>

<!-- SANDBOX CHROME, not the designed surface: the replay control that
     stands in for the poll loop. -->
<div class="replay" id="replay"></div>

<main class="wrap" id="screen"></main>

<script src="./sweat.js"></script>
</body>
</html>
