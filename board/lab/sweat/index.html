<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angles — Live sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="./sweat.css" rel="stylesheet">
</head>

<!-- LAB ITERATION L3 — THE LIVE SANDBOX (SWEAT_LAB_SPEC, realising
     docs/design/SWEAT_UI_BRIEF.md frames 1-9). Two screens — the live
     board and the chart-first card — as one page with client-side
     navigation.

     D-123 item (4): the wording says "Live"; the file names, the JSON
     names and the route fragments keep their spellings on purpose. -->

<!--

     IT READS ONE FILE, AND WHICH ONE IS THE MODE (L3b, D-122):

       REAL, THE DEFAULT: ../../data/sweats.json, written by
       fantasy_edge.live.sweat — the engine's own pregame probabilities
       against the market lines the live capture stored, with the
       prices as captured. Owner-ruled onto this lab surface under its
       ALPHA banner; it is an uncalibrated model and it is not a pick.

       DEMO, ONLY WITH ?demo=1: ../../demo/sweats.demo.json, an array
       of poll snapshots, every one of them fabricated, kept as the
       design and QA harness.

     The two never mix: sweat.js picks one URL before it fetches.

     AND A THIRD FILE ON A THIRD ROUTE (L3e): #/retro reads
     ../../data/sweats_retro_2026w01.json, written by
     fantasy_edge.live.sweat_retro — 2026 week 1 replayed from the
     play-by-play the capture job banked, against the lines the live
     capture stored. It is fetched only when that route is opened, it
     mixes with neither of the two above, and it carries NO
     probability of any kind: week 1 had no engine distribution and
     there is no live model yet. The RETROSPECTIVE sentinel below says
     exactly that, and it takes the top slot on that route. -->
<body data-sweats-real="../../data/sweats.json"
      data-sweats-demo="../../demo/sweats.demo.json"
      data-sweats-retro="../../data/sweats_retro_2026w01.json">

<!-- THE TWO BANNERS, written into the page itself and not only by the
     script, so they are on screen before anything is fetched and stay
     there if the fetch never answers. `sweat.js` re-renders these same
     elements from its own constants, and a test asserts the page and
     the constants say the same thing.

     The top slot carries the MODE'S OWN sentinel. The page ships with
     the ALPHA one on it because real is the default; `?demo=1` swaps
     in the SAMPLE one, which rides here too (`data-sample`) so both
     strings live on disk beside the script's own and neither can drift
     from it. One of them is on screen at all times, never both.

     THE RETROSPECTIVE ARM (L3e) rides the same slot on `data-retro`:
     on #/retro neither of the other two is true — nothing there is
     fabricated and nothing there is an engine probability — so that
     route takes the slot for its own sentinel. All three live on disk
     beside the script's own constants and a test asserts they are the
     same strings. -->
<div class="banner sample" id="topbanner"
     data-sample="SAMPLE LIVE BOARD — fabricated bets and numbers for design work; nothing here is a pick, a price, or a recommendation"
     data-retro="RETROSPECTIVE — 2026 week 1 replayed from saved play-by-play; no chances were ever worked out for this week">EARLY ACCESS LIVE BOARD — real lines and our own chances; not yet checked against history, so treat them as leans, not probabilities; the design is still being finished</div>
<div class="banner lab" id="labbanner">LAB — IN PROGRESS: design sandbox; the design is still being finished</div>

<!-- Frame 9's paused banner. Hidden until the replay has stood still
     for longer than twice the recording's own poll interval. -->
<div class="stale" id="stale" hidden></div>

<!-- SANDBOX CHROME, not the designed surface: the replay control that
     stands in for the poll loop. -->
<div class="replay" id="replay"></div>

<main class="wrap" id="screen"></main>

<script src="./sweat.js"></script>
</body>
</html>
