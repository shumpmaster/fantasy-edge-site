<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angles — Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="./style.css" rel="stylesheet">
</head>

<body data-board="./data/board.json"
      data-demo-board="./demo/board.demo.json"
      data-demo-live="./demo/live.demo.json">
<div class="wrap">

<div id="topbanner"></div>

<header>
  <div class="toprow">
    <h1>Angles <span class="alpha"
        title="Alpha: engine-certified projections; interface and features under active development (D-098)"
        >ALPHA</span></h1>
    <div class="runpill" id="runpill">loading</div>
  </div>
  <div class="fresh" id="fresh"></div>
</header>

<nav class="tabs" aria-label="Sections">
  <div class="tab on" aria-current="page">Board</div>
  <div class="tab lock" aria-disabled="true" title="Locked">Matchups<span class="soon">LOCKED</span></div>
  <div class="tab lock" aria-disabled="true" title="Locked">Lineup<span class="soon">M4.2</span></div>
  <div class="tab lock" aria-disabled="true" title="Locked">Props<span class="soon">M4.3</span></div>
</nav>

<div class="disc" id="disclosure"></div>

<div class="search">
  <input id="search" type="search" autocomplete="off" spellcheck="false"
         placeholder="Search player or matchup"
         aria-label="Search the board by player name or matchup">
</div>

<div class="filters">
  <div class="seg" id="posseg"></div>
  <div class="seg" id="sortseg"></div>
</div>

<div class="gseg" id="gameseg" role="group" aria-label="Filter by game"></div>

<div id="games"></div>
<div class="empty" id="empty" hidden></div>

<div class="foot" id="foot"></div>

</div>

<!-- the bottom tab bar (m4.2b feature 11): three views of THIS board,
     at the foot of the viewport, where a thumb is. It is a real
     tablist — the buttons are written by app.js on every render, each
     with role="tab" and its own aria-selected — and it is deliberately
     separate from the locked top nav above, which names the sections
     this product will grow rather than the ways of reading the one it
     already has. -->
<nav class="tabbar" id="tabbar" role="tablist"
     aria-label="Board views"></nav>

<script src="./app.js"></script>
</body>
</html>
